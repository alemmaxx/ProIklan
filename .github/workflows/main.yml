name: Kemas kini peraduan
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_peraduan.py
      - name: Simpan perubahan
        run: |
          git config user.name "proiklan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/peraduan.json
          git diff --cached --quiet || git commit -m "Kemas kini data peraduan"
          git push
